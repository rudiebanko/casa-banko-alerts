<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>CASA BANKO Alerts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel {
      width: 92%;
      max-width: 430px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      margin-bottom: 38px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 21px;
      margin-bottom: 14px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .buy {
      background: #199653;
    }

    .sell {
      background: #d43737;
    }

    .sl {
      background: #a52828;
    }

    .breakeven {
      background: #b88717;
    }

    .profit {
      background: #1877b8;
    }

    .closed {
      background: #383838;
    }

    #status {
      min-height: 24px;
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="panel">

    <h1>CASA BANKO</h1>
    <div class="subtitle">TRADE ALERTS</div>

    <button class="buy" onclick="sendAlert('buy')">
      🟢 BUYING NOW
    </button>

    <button class="sell" onclick="sendAlert('sell')">
      🔴 SELLING NOW
    </button>

    <button class="sl" onclick="sendAlert('sl')">
      ❌ SL HIT
    </button>

    <button class="breakeven" onclick="sendAlert('breakeven')">
      🟡 BREAKEVEN
    </button>

    <button class="profit" onclick="sendAlert('profit')">
      💰 TOOK PROFIT
    </button>

    <button class="closed" onclick="sendAlert('closed')">
      ✅ CLOSED OUT
    </button>

    <div id="status"></div>

  </div>

  <script>
    const FUNCTION_URL =
      "https://tpziplzdiifxryoourgp.supabase.co/functions/v1/send-trade-alert";

    async function sendAlert(action) {
      const status = document.getElementById("status");

      status.textContent = "Sending...";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: action
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Alert failed");
        }

        status.textContent = "✅ Alert sent!";
      } catch (error) {
        console.error(error);
        status.textContent = "❌ " + error.message;
      }
    }
  </script>

</body>
</html>
