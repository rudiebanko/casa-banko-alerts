<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>CASA BANKO Alerts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel {
      width: 92%;
      max-width: 430px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 35px;
      font-size: 14px;
    }

    button {
      width: 100%;
      height: 78px;
      margin: 9px 0;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #168c4b;
    }

    .sell {
      background: #c93636;
    }

    .sl {
      background: #8f2626;
    }

    .closed {
      background: #333;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      min-height: 25px;
      margin-top: 20px;
      color: #aaa;
    }

    .settings {
      margin-top: 25px;
      background: transparent;
      border: 1px solid #333;
      height: 48px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="panel">

  <h1>CASA BANKO</h1>
  <div class="subtitle">TRADE ALERTS</div>

  <button class="buy" onclick="sendAlert('buy', 'BUYING NOW')">
    🟢 BUYING NOW
  </button>

  <button class="sell" onclick="sendAlert('sell', 'SELLING NOW')">
    🔴 SELLING NOW
  </button>

  <button class="sl" onclick="sendAlert('sl', 'SL HIT')">
    🛑 SL HIT
  </button>

  <button class="closed" onclick="sendAlert('closed', 'CLOSED OUT')">
    ✅ CLOSED OUT
  </button>

  <div id="status"></div>

  <button class="settings" onclick="resetKey()">
    CHANGE PRIVATE KEY
  </button>

</div>

<script>

const ENDPOINT =
  "https://tpziplzdiifxryoourgp.supabase.co/functions/v1/send-trade-alert";

function getKey() {
  let key = localStorage.getItem("casaBankoControlKey");

  if (!key) {
    key = prompt("Enter your CASA BANKO private control key:");

    if (key) {
      localStorage.setItem("casaBankoControlKey", key);
    }
  }

  return key;
}

function resetKey() {
  localStorage.removeItem("casaBankoControlKey");
  alert("Private key removed from this device.");
}

async function sendAlert(action, label) {

  const confirmed = confirm(`Send "${label}" to RUDIE ANALYSIS?`);

  if (!confirmed) return;

  const key = getKey();

  if (!key) {
    alert("Private key required.");
    return;
  }

  const status = document.getElementById("status");
  const buttons = document.querySelectorAll("button");

  buttons.forEach(button => button.disabled = true);

  status.textContent = "Sending...";

  try {

    const response = await fetch(ENDPOINT, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "x-control-key": key
      },

      body: JSON.stringify({
        action: action
      })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      status.textContent = "✓ Alert sent";
    } else if (response.status === 401) {
      localStorage.removeItem("casaBankoControlKey");
      status.textContent = "Wrong private key";
      alert("Private key incorrect. Enter it again.");
    } else {
      status.textContent = "Error sending alert";
    }

  } catch (error) {
    status.textContent = "Connection error";
  }

  buttons.forEach(button => button.disabled = false);
}

</script>

</body>
</html>
